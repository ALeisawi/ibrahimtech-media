<style>
/* Layout: one column, phone first. The sheet grid is the motif: the score fills a row of 10 cells (A1:J1). */
:root{
  --bg:#0b1220; --panel:#0B1F4B; --line:#21C063; --mint:#7DFAA6;
  --ink:#e8eefc; --mute:#9fb0d0; --cell:#ffffff; --cellink:#111827; --grid:#d1d5db;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--ar);font-size:18px;line-height:1.7;
  background:radial-gradient(120% 60% at 50% 0%,#13213d 0%,var(--bg) 70%) fixed;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:18px}
.brand b{color:var(--line);font-weight:800}
.badge{font:700 13px var(--lat);border:2px solid var(--line);border-radius:8px;padding:2px 10px;background:var(--panel);direction:ltr;display:inline-flex;gap:6px;align-items:center}
.badge i{display:grid;grid-template-columns:repeat(3,4px);gap:1px}
.badge i span{width:4px;height:4px;background:var(--line)}
h1{font-size:clamp(34px,9vw,48px);line-height:1.25;margin:6px 0 0;font-weight:900;text-wrap:balance}
.lead{color:var(--mute);margin:0;font-size:19px}

/* the score row: the one bold element */
.row{display:grid;grid-template-columns:72px repeat(5,1fr);direction:ltr;border-radius:10px;overflow:hidden;background:var(--cell);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.row .h{background:#e5e7eb;color:#4b5563;font:700 11px var(--lat);text-align:center;padding:3px 0;border-left:1px solid var(--grid)}
.row .rn{background:#e5e7eb;color:#4b5563;font:700 11px var(--ar);display:flex;align-items:center;justify-content:center;border-top:1px solid var(--grid);direction:rtl}
.row .rn.cur{background:#dcfce7;color:#15803d}
.row .c{height:26px;border-left:1px solid var(--grid);border-top:1px solid var(--grid);background:var(--cell);transition:background .35s ease}
.row .c.ok{background:var(--line)}
.row .c.no{background:#fee2e2}
.row .c.now{box-shadow:inset 0 0 0 3px var(--line)}

.fbar{display:flex;gap:12px;align-items:center;background:#f3f4f6;color:var(--cellink);border-radius:12px;padding:10px 14px;font:600 15px "Liberation Mono",var(--lat);direction:ltr;overflow-x:auto;white-space:nowrap}
.fbar .fx{color:#6b7280;font-style:italic;font-family:serif}

.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.q{font-size:23px;font-weight:800;line-height:1.5;margin:0;text-wrap:balance}
.code{direction:ltr;unicode-bidi:isolate;display:block;background:var(--cell);color:var(--cellink);border-radius:10px;padding:10px 14px;font:700 16px "Liberation Mono",var(--lat);overflow-x:auto;white-space:nowrap}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:13px 16px;font-size:19px;font-weight:700;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--mint)}
.opt:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--cell);color:var(--cellink);display:grid;place-items:center;font:800 14px var(--lat)}
.opt .t{min-width:0}
.opt bdi,.opt .lat{font-family:var(--lat);direction:ltr;unicode-bidi:isolate}
.opt.right{border-color:var(--line);background:rgba(33,192,99,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(248,113,113,.12)}
.opt[disabled]{cursor:default}
.why{margin:0;color:var(--mint);font-weight:700;font-size:17px}
.why.badw{color:var(--warn)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mute);font-size:15px}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--line);color:#06121f;font-weight:900;font-size:20px;border-radius:999px;padding:14px 30px}
.btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.25)}
.btn[disabled]{opacity:.4;cursor:default}

.level{font-size:clamp(44px,13vw,64px);font-weight:900;line-height:1.1;margin:0}

.score{font:800 20px var(--lat);color:var(--mint)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list a{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;font-weight:700}
.list a:hover,.list a:focus-visible{border-color:var(--mint);outline:none}
.list a span:last-child{color:var(--mint);font-size:15px;flex:none}
h2{font-size:22px;margin:0;font-weight:800}
.form{display:grid;gap:12px}
label.f{display:grid;gap:6px;font-weight:700;font-size:16px}
input[type=text],input[type=tel],input[type=email]{font:600 18px var(--ar);background:var(--cell);color:var(--cellink);border:2px solid var(--grid);border-radius:12px;padding:11px 14px;width:100%}
input:focus-visible{outline:3px solid var(--mint);outline-offset:1px}
input[type=tel],input[type=email]{direction:ltr;text-align:right;font-family:var(--lat)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.6;color:var(--ink)}
.consent input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--line)}
.fine{color:var(--mute);font-size:13px;margin:0;line-height:1.7}
.err{color:var(--bad);font-weight:700;font-size:15px;margin:0}
.done{color:var(--mint);font-weight:800;margin:0}
footer{color:var(--mute);font-size:13px;text-align:center}
footer a{color:var(--mint)}

.sh{border-radius:12px;overflow:hidden;background:var(--cell);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sh .fbar{border-radius:0;border-bottom:1px solid var(--grid)}
.shx{overflow-x:auto}
.st{border-collapse:collapse;width:100%;direction:rtl;color:var(--cellink);font-size:16px}
.st th{background:#e5e7eb;color:#4b5563;font:700 11px var(--lat);padding:3px 6px;border:1px solid var(--grid)}
.st td{border:1px solid var(--grid);padding:6px 8px;text-align:center;white-space:nowrap;height:36px;min-width:48px}
.st td.rn{background:#e5e7eb;color:#4b5563;font:700 11px var(--lat);min-width:26px;width:26px;padding:0}
.st td.hd{background:#107c41;color:#fff;font-weight:800}
.st td.num{font:600 15px var(--lat)}
.st td.err{color:#b91c1c;font:700 14px var(--lat)}
.st td.sel{outline:3px solid var(--line);outline-offset:-3px;background:#f0fdf4}
.st td.nar{max-width:56px;width:56px;font-family:var(--lat)}
.st td.pre{white-space:pre;background:#fef9c3}
.dots{display:inline-flex;gap:5px;direction:ltr}
.dots i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.18)}
.dots i.ok{background:var(--line)} .dots i.sk{background:var(--warn)} .dots i.no{background:var(--bad)} .dots i.now{box-shadow:0 0 0 2px var(--mint)}


.idk{all:unset;cursor:pointer;justify-self:start;color:var(--mute);font-weight:700;font-size:16px;padding:6px 12px;border:2px dashed rgba(255,255,255,.22);border-radius:12px}
.idk:hover,.idk:focus-visible{color:var(--ink);border-color:var(--mint);outline:none}
.idk[disabled]{opacity:.35;cursor:default}
@media (min-width:900px){
  body{font-size:19px;padding-block:36px 64px}
  .wrap{max-width:1080px}
  header{padding-bottom:6px}
  .intro{max-width:720px;margin:6vh auto 0;text-align:center;align-items:center}
  .intro h1{font-size:64px}
  .intro .lead{font-size:22px}
  .qc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:32px;row-gap:16px;padding:30px 32px;
      grid-template-areas:"nav nav" "q q" "sh opts" "sh idk" "sh why" "sh foot";align-items:start}
  .qc>.nav:first-child{grid-area:nav}
  .qc>.q{grid-area:q;font-size:28px}
  .qc>.sh{grid-area:sh}
  .qc>.opts{grid-area:opts}
  .qc>.why{grid-area:why}
  .qc>.idk{grid-area:idk}
  .qc>.foot{grid-area:foot}
  .qc .st{font-size:18px}
  .qc .st td{height:44px}
  .opt{font-size:20px;padding:15px 18px}
  .res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;align-items:start}
  .res>*{grid-column:1}
  .res>.leadc{grid-column:2;grid-row:1 / span 5}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const sid = Math.random().toString(36).slice(2,10);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let lv, set, idx, log, locked, ended=false;

function pickSet(l){
  const pool = BANK.filter(q=>q.lv===l+1).slice();
  for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]];}
  return pool.slice(0,PER);
}
function dots(){
  const res=log.filter(x=>x.l===lv);
  return `<span class="dots" aria-hidden="true">${Array.from({length:PER},(_,c)=>`<i class="${res[c]?(res[c].ok?'ok':res[c].idk?'sk':'no'):(c===res.length&&!ended?'now':'')}"></i>`).join("")}</span>`;
}
function drawRow(){}
function send(payload){
  if(!ENDPOINT) return Promise.resolve(false);
  return fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>true).catch(()=>false);
}
function intro(){
  ended=false; log = null; lv = 0; drawRow();
  app.innerHTML = `<section class="wrap intro" style="gap:18px">
    <h1>وش مستواك في إكسل؟</h1>
    <p class="lead">تبدأ من السهل وتصعب معك. كل مستوى ٥ أسئلة، وإذا جبت ٤ منها صح تنتقل للي بعده. إذا ما تعرف الجواب اضغط «ما أعرف» بدل التخمين، عشان تطلع نتيجتك دقيقة. وفي الآخر تعرف مستواك ووش تتعلم بعدها.</p>
        <div><button class="btn" id="go">ابدأ الاختبار</button></div>
    <p class="fine">٥ مستويات و١٠٠ سؤال، وكل مرة تطلع لك أسئلة مختلفة.</p>
  </section>`;
  document.getElementById("go").onclick = ()=>{ log=[]; lv=0; set=pickSet(0); idx=0; question(); };
}
function question(){
  locked=false; drawRow();
  const x = set[idx];
  app.innerHTML = `<section class="card qc" aria-live="polite">
    <div class="nav"><span>المستوى <bdi>${lv+1}</bdi> من <bdi>5</bdi>: ${LVN[lv]}</span>${dots()}</div>
    <p class="q">${esc(x.q)}</p>
    ${sheetHTML(BANK.indexOf(x),x.c)}
    <div class="opts">${x.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${"أبجد"[k]}</span><span class="t" dir="auto">${esc(t)}</span></button>`).join("")}</div>
    <button class="idk" id="idk">ما أعرف 🤷</button>
    <p class="why" id="why" hidden></p>
    <div class="nav foot"><span></span><button class="btn" id="next" hidden>التالي</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.getElementById("idk").onclick=()=>pick(-1);
}
function pick(k){
  if(locked) return; locked=true;
  const x=set[idx], ok=k===x.a;
  log.push({l:lv,ok,idk:k<0,id:BANK.indexOf(x)});
  document.getElementById("idk").disabled=true;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true; if(j===x.a)b.classList.add("right"); else if(j===k)b.classList.add("wrong");});
  const why=document.getElementById("why");
  why.textContent=(ok?"صح ✓ ":k<0?"ولا يهمك، هذا الجواب: ":"الصح هو المظلل بالأخضر. ")+x.w; why.classList.toggle("badw",!ok); why.hidden=false;
  const wrong = log.filter(r=>r.l===lv && !r.ok).length, done = log.filter(r=>r.l===lv).length;
  const failed = wrong > PER-PASS, finished = done===PER;
  const nx=document.getElementById("next"); nx.hidden=false;
  let next;
  if(failed) { nx.textContent="شف نتيجتك"; next=()=>result(lv); }
  else if(finished) {
    if(lv===4){ nx.textContent="شف نتيجتك"; next=()=>result(5); }
    else { nx.textContent="المستوى الجاي ⬆"; next=()=>{lv++; set=pickSet(lv); idx=0; question();}; }
  } else { nx.textContent="السؤال الجاي"; next=()=>{idx++; question();}; }
  nx.onclick=next; nx.focus({preventScroll:true});
  const d=app.querySelector(".dots"); if(d) d.outerHTML=dots();
}
function result(passed){
  ended=true; const L=RESULT[passed], score=log.filter(r=>r.ok).length;
  drawRow();
  send({type:"result", sid, score, asked:log.length, level:L.name, passed, answers:log.map(r=>r.id+(r.ok?"+":r.idk?"?":"-")).join(" "), ua:navigator.language||""});
  app.innerHTML = `<section class="wrap res" style="gap:20px">
    <div class="card">
      <p class="level"><small>مستواك</small>${L.name}</p>
      <div class="score"><bdi>${score}</bdi> صح من <bdi>${log.length}</bdi></div>
      <p style="margin:0">${L.line}</p>
    </div>
    <h2>ابدأ بهالمقاطع</h2>
    <ul class="list">${L.vids.map(v=>`<li><a href="${V(v[1])}" target="_blank" rel="noopener"><span>${v[0]}</span><span>شاهد</span></a></li>`).join("")}</ul>
    <div class="card leadc">
      <h2>نبهني أول ما تنزل دورة مستوى «${L.name}»</h2>
      <p style="margin:0;color:var(--mint);font-weight:800">🎁 سجّل ويوصلك كود خصم خاص على الدورة أول ما تنزل.</p>
      <form class="form" id="lead" novalidate>
        <label class="f" for="nm">اسمك<input id="nm" type="text" autocomplete="given-name" maxlength="60"></label>
        <label class="f" for="em">إيميلك<input id="em" type="email" autocomplete="email" maxlength="120"></label>
        <label class="f" for="wa">رقم الواتساب (اختياري)<input id="wa" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx" maxlength="20"></label>
        <label class="consent" for="ok"><input id="ok" type="checkbox"><span>أوافق إن إبراهيم تِك يرسل لي على الإيميل أو الواتساب عن الدورات والعروض وأكواد الخصم. أقدر ألغي متى ما بغيت.</span></label>
        <p class="err" id="err" hidden></p>
        <button class="btn" type="submit" id="sb">نبهني وأرسل كود الخصم</button>
        <p class="fine">نستخدم بياناتك لتنبيهك بالدورات بس، وما نعطيها لأحد. نتيجة الاختبار تنحفظ بدون اسم عشان نعرف وش المحتوى اللي يفيدكم.</p>
      </form>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn ghost" id="again">أعد الاختبار</button><button class="btn ghost" id="share">انسخ الرابط لزميلك</button></div>
    <p class="done" id="copied" hidden></p>
  </section>`;
  document.getElementById("again").onclick=intro;
  document.getElementById("share").onclick=()=>{
    const msg=document.getElementById("copied"), url=location.href.split("#")[0];
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>{msg.textContent="تم نسخ الرابط ✓";msg.hidden=false}).catch(()=>{msg.textContent=url;msg.hidden=false});
  };
  document.getElementById("lead").onsubmit=e=>{
    e.preventDefault();
    const nm=document.getElementById("nm").value.trim(), em=document.getElementById("em").value.trim(), wa=document.getElementById("wa").value.replace(/[^\d+]/g,""), ok=document.getElementById("ok").checked;
    const err=document.getElementById("err"), fail=t=>{err.textContent=t;err.hidden=false};
    if(!nm) return fail("اكتب اسمك.");
    if(!/^\S+@\S+\.\S+$/.test(em)) return fail("اكتب إيميل صحيح، مثل name@gmail.com.");
    if(wa && wa.length<9) return fail("رقم الواتساب ناقص، صححه أو خله فاضي.");
    if(!ok) return fail("علّم على الموافقة عشان نقدر نرسل لك التنبيه.");
    err.hidden=true;
    const sb=document.getElementById("sb"); sb.disabled=true; sb.textContent="جاري الحفظ…";
    const code=String(Math.floor(1000+Math.random()*9000));
    send({type:"lead", sid, code, name:nm, whatsapp:wa, email:em, consent:true, level:L.name, score}).then(()=>{
      const waText=encodeURIComponent(`أؤكد رقمي للتنبيه بدورة إكسل (${L.name}). كود التأكيد: ${code}`);
      document.getElementById("lead").innerHTML=`
        <p class="done">باقي خطوة وحدة: أكّد إيميلك عشان يوصلك كود الخصم 🎁</p>
        <p style="margin:0">أرسلنا رابط تأكيد على <bdi>${esc(em)}</bdi>. افتحه واضغط «أكّد إيميلي». إذا ما لقيته شف الرسائل غير المرغوب فيها (Spam).</p>
        ${wa&&WA_NUMBER?`<p style="margin:0">ولو تبي التنبيه على الواتساب بعد، اضغط الزر وأرسل الرسالة الجاهزة فيها كود التأكيد <bdi class="score">${code}</bdi>.</p><a class="btn" href="https://wa.me/${WA_NUMBER}?text=${waText}" target="_blank" rel="noopener">أكّد رقمي بالواتساب</a>`:""}
        <p class="fine">إذا ما أكدت، ما نرسل لك شي.</p>`;
    });
  };
}
intro();
</script>
</body>
</html>
